[package]
name = "pln-repl"
version = "1.0.4"
edition = "2021"
description = "AI-native agentic REPL for PlainScript with Ratatui & ratatui-image"
authors = ["PlainScript Contributors"]

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
ratatui-image = "3.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
unicode-width = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
