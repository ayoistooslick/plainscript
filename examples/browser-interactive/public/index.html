<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlainScript Clicker</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #0d1117;
      color: #e6edf3;
      font-family: system-ui, "Segoe UI", sans-serif;
    }
    .card {
      width: 360px;
      padding: 20px;
      border: 1px solid #30363d;
      border-radius: 10px;
      background: #161b22;
      text-align: center;
    }
    #score { font-size: 34px; font-weight: 700; color: #40c463; }
    .row { display: flex; gap: 10px; justify-content: center; }
    button {
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #40c463;
      color: #0d1117;
    }
    button.secondary { background: #30363d; color: #e6edf3; }
    button.level-up { animation: pulse 0.6s ease-in-out; }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }
    ul#history {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 140px;
      overflow: auto;
      font-size: 13px;
      color: #8b949e;
      text-align: left;
    }
    ul#history li { padding: 2px 0; }
    kbd {
      padding: 1px 5px;
      border: 1px solid #30363d;
      border-radius: 4px;
      background: #21262d;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>PlainScript Clicker</h1>
    <p><span id="score">0</span></p>
    <div class="row">
      <button id="click-button" type="button">+10 points</button>
      <button id="log-button" type="button" class="secondary">Log entry</button>
    </div>
    <p><kbd>R</kbd> resets the score and history</p>
  </div>
  <div class="card">
    <h2>Run log</h2>
    <ul id="history"></ul>
  </div>
  <script src="interactive.js"></script>
</body>
</html>
