<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlainScript 3D</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #0d1117;
      color: #e6edf3;
      font-family: system-ui, "Segoe UI", sans-serif;
    }
    .note {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(13, 17, 23, 0.75);
      font-size: 13px;
      color: #8b949e;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="scene.js"></script>
</body>
</html>
