name: Release Standalone Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.4)"
        required: false

jobs:
  build-binaries:
    name: Build Standalone Executables
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: plainscript-linux-x64
            artifact: plainscript-linux-x64
          - os: macos-latest
            target: plainscript-macos-arm64
            artifact: plainscript-macos-arm64
          - os: windows-latest
            target: plainscript-windows-x64.exe
            artifact: plainscript-windows-x64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Compile Standalone Executable (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          bun build --compile --minify ./compiler/cli.js --outfile ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - name: Compile Standalone Executable (Windows)
        if: runner.os == 'Windows'
        run: |
          bun build --compile --minify ./compiler/cli.js --outfile ${{ matrix.artifact }}

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  publish-release:
    name: Attach Binaries to GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Generate SHA-256 Checksums
        run: |
          cd release-artifacts
          find . -type f -exec sha256sum {} + > CHECKSUMS.txt
          cat CHECKSUMS.txt

      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            release-artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
