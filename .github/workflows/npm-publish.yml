name: Publish PlainScript

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 2.0)"
        required: true
        default: "2.0.0"

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm install

      - name: Update package version (if needed)
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          TARGET="${{ github.event.inputs.version }}"

          echo "Current: $CURRENT"
          echo "Target : $TARGET"

          if [ "$CURRENT" != "$TARGET" ]; then
            npm version "$TARGET" --no-git-tag-version
          else
            echo "Version already matches. Skipping update."
          fi

      - name: Run tests
        run: npm test

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump (if changed)
        run: |
          git config user.name "ayoistooslick"
          git config user.email "davidayodele847@gmail.com"

          git add package.json package-lock.json

          if git diff --cached --quiet; then
            echo "No version changes to commit."
          else
            git commit -m "Release v${{ github.event.inputs.version }}"
            git push origin main
          fi

      - name: Create tag (if missing)
        run: |
          TAG="v${{ github.event.inputs.version }}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag already exists."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: PlainScript v${{ github.event.inputs.version }}
          generate_release_notes: true
